<div
  class="flower-container relative flex items-center justify-center cursor-pointer select-none transition-transform duration-500 hover:scale-105"
  [class.is-bloomed]="isBloomed"
  (click)="onFlowerClick()"
  title="Toca la flor para escuchar destellos mágicos ✨"
>
  <svg
    viewBox="0 0 500 550"
    class="w-full max-w-[420px] md:max-w-[480px] h-auto drop-shadow-2xl overflow-visible"
    xmlns="http://www.w3.org/2000/svg"
  >
    <defs>
      <!-- Gradiente Tallo -->
      <linearGradient id="stemGradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#15803d" />
        <stop offset="45%" stop-color="#22c55e" />
        <stop offset="100%" stop-color="#166534" />
      </linearGradient>

      <!-- Gradiente Hoja Izquierda -->
      <linearGradient id="leafGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4ade80" />
        <stop offset="50%" stop-color="#16a34a" />
        <stop offset="100%" stop-color="#14532d" />
      </linearGradient>

      <!-- Gradiente Hoja Derecha -->
      <linearGradient id="leafGradRight" x1="100%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#86efac" />
        <stop offset="60%" stop-color="#22c55e" />
        <stop offset="100%" stop-color="#15803d" />
      </linearGradient>

      <!-- Gradiente Pétalos Exteriores (Amarillo brillante a dorado) -->
      <linearGradient id="outerPetalGrad" x1="0%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#f59e0b" />
        <stop offset="35%" stop-color="#fbbf24" />
        <stop offset="75%" stop-color="#fef08a" />
        <stop offset="100%" stop-color="#ffffff" />
      </linearGradient>

      <!-- Gradiente Pétalos Interiores (Azafrán y miel cálido) -->
      <linearGradient id="innerPetalGrad" x1="0%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#d97706" />
        <stop offset="40%" stop-color="#f59e0b" />
        <stop offset="85%" stop-color="#fde047" />
        <stop offset="100%" stop-color="#fef9c3" />
      </linearGradient>

      <!-- Gradiente Centro de la Flor (Chocolate y ámbar) -->
      <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#451a03" />
        <stop offset="40%" stop-color="#78350f" />
        <stop offset="75%" stop-color="#b45309" />
        <stop offset="90%" stop-color="#d97706" />
        <stop offset="100%" stop-color="#fbbf24" />
      </radialGradient>

      <!-- Brillo aureola de la flor -->
      <radialGradient id="sunburstGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fde047" stop-opacity="0.8" />
        <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.4" />
        <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
      </radialGradient>

      <!-- Filtro de sombra suave para pétalos -->
      <filter id="petalShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#78350f" flood-opacity="0.25" />
      </filter>
    </defs>

    <!-- Tallo orgánico que crece suavemente -->
    <path
      d="M250 540 Q 242 420, 255 310 T 250 170"
      fill="none"
      stroke="url(#stemGradient)"
      stroke-width="12"
      stroke-linecap="round"
      class="stem-grow"
      [class.grown]="isBloomed"
    />

    <!-- Hoja izquierda -->
    <g class="leaf leaf-left" [class.grown]="isBloomed" style="transform-origin: 247px 370px;">
      <path
        d="M 247 370 C 180 360, 130 330, 110 370 C 135 420, 200 410, 247 375 Z"
        fill="url(#leafGradLeft)"
        stroke="#15803d"
        stroke-width="1.5"
      />
      <!-- Nervaduras de la hoja izquierda -->
      <path
        d="M 247 370 Q 180 372, 110 370 M 215 371 Q 195 360, 185 352 M 175 371 Q 155 363, 145 357 M 205 373 Q 190 388, 175 393"
        fill="none"
        stroke="#86efac"
        stroke-width="1.2"
        opacity="0.6"
      />
    </g>

    <!-- Hoja derecha -->
    <g class="leaf leaf-right" [class.grown]="isBloomed" style="transform-origin: 253px 290px;">
      <path
        d="M 253 290 C 320 275, 375 250, 395 285 C 370 335, 305 325, 253 295 Z"
        fill="url(#leafGradRight)"
        stroke="#166534"
        stroke-width="1.5"
      />
      <!-- Nervaduras de la hoja derecha -->
      <path
        d="M 253 290 Q 320 286, 395 285 M 285 288 Q 310 278, 325 270 M 330 287 Q 355 279, 368 274 M 295 292 Q 315 307, 335 312"
        fill="none"
        stroke="#bbf7d0"
        stroke-width="1.2"
        opacity="0.6"
      />
    </g>

    <!-- Sépalo (Cáliz verde de la base floral) -->
    <g [class.bloomed]="isBloomed" class="flower-center">
      <path d="M 235 185 Q 250 205, 265 185 Q 250 170, 235 185 Z" fill="#15803d" />
      <path d="M 220 180 Q 235 200, 250 182 Z" fill="#166534" />
      <path d="M 280 180 Q 265 200, 250 182 Z" fill="#166534" />
    </g>

    <!-- Resplandor exterior cuando florece -->
    @if (isBloomed) {
      <circle
        cx="250"
        cy="170"
        r="40"
        fill="url(#sunburstGlow)"
        class="center-glow pointer-events-none"
      />
    }

    <!-- Cabeza de la flor (Pétalos y centro) -->
    <g class="flower-head">
      <!-- Capa 1: Pétalos Exteriores (16 pétalos más largos) -->
      <g class="petal-layer">
        @for (petal of outerPetals; track petal.angle) {
          <g
            class="petal"
            [class.bloomed]="isBloomed"
            [style.--angle]="petal.angle + 'deg'"
            [style.transition-delay]="petal.delay + 's'"
            filter="url(#petalShadow)"
          >
            <!-- Pétalo alargado estilizado tipo girasol -->
            <path
              d="M 250 170
                 C 236 140, 232 90, 250 50
                 C 268 90, 264 140, 250 170 Z"
              fill="url(#outerPetalGrad)"
              stroke="#eab308"
              stroke-width="0.8"
            />
            <!-- Línea sutil de pliegue central del pétalo -->
            <line
              x1="250"
              y1="165"
              x2="250"
              y2="75"
              stroke="#ca8a04"
              stroke-width="0.75"
              opacity="0.45"
            />
          </g>
        }
      </g>

      <!-- Capa 2: Pétalos Interiores (16 pétalos más cálidos y compactos) -->
      <g class="petal-layer">
        @for (petal of innerPetals; track petal.angle) {
          <g
            class="petal"
            [class.bloomed]="isBloomed"
            [style.--angle]="petal.angle + 'deg'"
            [style.transition-delay]="petal.delay + 's'"
            filter="url(#petalShadow)"
          >
            <path
              d="M 250 170
                 C 238 145, 235 105, 250 72
                 C 265 105, 262 145, 250 170 Z"
              fill="url(#innerPetalGrad)"
              stroke="#d97706"
              stroke-width="0.8"
            />
            <line
              x1="250"
              y1="165"
              x2="250"
              y2="95"
              stroke="#b45309"
              stroke-width="0.6"
              opacity="0.5"
            />
          </g>
        }
      </g>

      <!-- Capa 3: Centro de la flor (Botón / Pistilo con textura y polen) -->
      <g class="flower-center" [class.bloomed]="isBloomed">
        <!-- Aro exterior dorado con reborde -->
        <circle
          cx="250"
          cy="170"
          r="38"
          fill="none"
          stroke="#fde047"
          stroke-width="3"
          stroke-opacity="0.6"
          class="animate-pulse"
        />

        <!-- Disco central principal -->
        <circle
          cx="250"
          cy="170"
          r="36"
          fill="url(#centerGrad)"
          stroke="#78350f"
          stroke-width="2"
        />

        <!-- Detalle de semillas / polen concéntrico -->
        <circle cx="250" cy="170" r="28" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3, 4" opacity="0.8" />
        <circle cx="250" cy="170" r="20" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="2, 4" opacity="0.9" />
        <circle cx="250" cy="170" r="12" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="2, 3" opacity="0.9" />
        <circle cx="250" cy="170" r="4" fill="#fef08a" />

        <!-- Corona de puntos de polen radiante -->
        @for (dot of [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330]; track dot) {
          <circle
            cx="250"
            cy="170"
            r="1.8"
            fill="#fde047"
            [style.transform-origin]="'250px 170px'"
            [style.transform]="'rotate(' + dot + 'deg) translate(0px, -32px)'"
          />
        }
      </g>
    </g>
  </svg>
</div>
