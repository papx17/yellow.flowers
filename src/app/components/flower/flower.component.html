<div
  class="flower-container relative flex items-center justify-center cursor-pointer select-none transition-transform duration-700 ease-out"
  [class.is-bloomed]="isBloomed"
  [style.transform]="'perspective(1000px) rotateY(' + tiltX() + 'deg) rotateX(' + -tiltY() + 'deg)'"
  (click)="onFlowerClick()"
  title="Toca la flor para escuchar destellos mágicos ✨"
>
  <svg
    viewBox="0 0 500 560"
    class="w-full max-w-[440px] md:max-w-[520px] h-auto drop-shadow-[0_25px_35px_rgba(0,0,0,0.6)] overflow-visible"
    xmlns="http://www.w3.org/2000/svg"
  >
    <defs>
      <!-- Gradientes del Tallo -->
      <linearGradient id="mainStemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#14532d" />
        <stop offset="35%" stop-color="#22c55e" />
        <stop offset="70%" stop-color="#16a34a" />
        <stop offset="100%" stop-color="#0f3d1f" />
      </linearGradient>

      <!-- Gradientes de Hojas -->
      <linearGradient id="leafGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4ade80" />
        <stop offset="45%" stop-color="#16a34a" />
        <stop offset="100%" stop-color="#14532d" />
      </linearGradient>

      <linearGradient id="leafGradSecondary" x1="100%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#86efac" />
        <stop offset="55%" stop-color="#22c55e" />
        <stop offset="100%" stop-color="#15803d" />
      </linearGradient>

      <!-- Gotas de rocío -->
      <radialGradient id="dewDropGrad" cx="35%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
        <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.6" />
        <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
      </radialGradient>

      <!-- Rayos Divinos Dorados -->
      <radialGradient id="godRayGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fef08a" stop-opacity="0.45" />
        <stop offset="30%" stop-color="#fde047" stop-opacity="0.25" />
        <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.08" />
        <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
      </radialGradient>

      <!-- Capa 1: Pétalos Exteriores (Dorado profundo y cálido) -->
      <linearGradient id="petalGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#d97706" />
        <stop offset="25%" stop-color="#f59e0b" />
        <stop offset="65%" stop-color="#fbbf24" />
        <stop offset="90%" stop-color="#fef08a" />
        <stop offset="100%" stop-color="#ffffff" />
      </linearGradient>

      <!-- Capa 2: Pétalos Medios (Amarillo Sol Intenso) -->
      <linearGradient id="petalGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#b45309" />
        <stop offset="20%" stop-color="#f59e0b" />
        <stop offset="60%" stop-color="#fde047" />
        <stop offset="85%" stop-color="#fef9c3" />
        <stop offset="100%" stop-color="#ffffff" />
      </linearGradient>

      <!-- Capa 3: Pétalos Interiores (Azafrán Radiante) -->
      <linearGradient id="petalGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#9a3412" />
        <stop offset="25%" stop-color="#d97706" />
        <stop offset="70%" stop-color="#facc15" />
        <stop offset="92%" stop-color="#fef08a" />
        <stop offset="100%" stop-color="#ffffff" />
      </linearGradient>

      <!-- Capa 4: Pétalos del Corazón (Miel Dorada) -->
      <linearGradient id="petalGrad4" x1="0%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#78350f" />
        <stop offset="35%" stop-color="#b45309" />
        <stop offset="75%" stop-color="#fbbf24" />
        <stop offset="100%" stop-color="#fef08a" />
      </linearGradient>

      <!-- Centro de la Flor (Chocolate y ámbar aterciopelado) -->
      <radialGradient id="sunflowerCoreGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#2a0f02" />
        <stop offset="35%" stop-color="#451a03" />
        <stop offset="65%" stop-color="#78350f" />
        <stop offset="85%" stop-color="#b45309" />
        <stop offset="97%" stop-color="#d97706" />
        <stop offset="100%" stop-color="#f59e0b" />
      </radialGradient>

      <!-- Filtro de sombra profunda multicapa para pétalos -->
      <filter id="petalShadow3D" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#451a03" flood-opacity="0.35" />
      </filter>

      <!-- Filtro de resplandor dorado -->
      <filter id="goldenGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>

    <!-- RAYOS SOLARES CELESTIALES (GOD RAYS) DE FONDO -->
    @if (isBloomed) {
      <g class="god-rays-container" style="transform-origin: 250px 170px;">
        @for (ray of sunRays; track ray.angle) {
          <polygon
            points="250,170 230,-40 270,-40"
            fill="url(#godRayGrad)"
            [style.transform-origin]="'250px 170px'"
            [style.transform]="'rotate(' + ray.angle + 'deg)'"
            class="animate-pulse"
          />
        }
      </g>
    }

    <!-- TALLO ORGÁNICO CON CURVATURA NATURAL -->
    <g class="stem-group">
      <!-- Tallo sombra de fondo -->
      <path
        d="M250 550 Q 240 430, 256 310 T 250 170"
        fill="none"
        stroke="#064e3b"
        stroke-width="14"
        stroke-linecap="round"
        class="stem-grow"
        [class.grown]="isBloomed"
      />
      <!-- Tallo principal iluminado -->
      <path
        d="M250 550 Q 240 430, 256 310 T 250 170"
        fill="none"
        stroke="url(#mainStemGrad)"
        stroke-width="10"
        stroke-linecap="round"
        class="stem-grow"
        [class.grown]="isBloomed"
      />
    </g>

    <!-- 4 HOJAS DETALLADAS CON NERVADURAS Y ROCÍO -->
    <!-- 1. Hoja Inferior Izquierda -->
    <g class="leaf leaf-lower-left" [class.grown]="isBloomed" style="transform-origin: 246px 420px;">
      <path
        d="M 246 420 C 170 415, 110 390, 85 435 C 120 485, 200 465, 246 425 Z"
        fill="url(#leafGradPrimary)"
        stroke="#14532d"
        stroke-width="1.5"
      />
      <path
        d="M 246 420 Q 170 435, 85 435 M 210 426 Q 190 415, 175 408 M 170 429 Q 150 420, 135 414 M 200 431 Q 185 448, 170 455"
        fill="none"
        stroke="#86efac"
        stroke-width="1.2"
        opacity="0.55"
      />
      <!-- Gota de rocío en hoja -->
      <circle cx="130" cy="430" r="3.5" fill="url(#dewDropGrad)" />
      <circle cx="129" cy="429" r="1" fill="#ffffff" />
    </g>

    <!-- 2. Hoja Inferior Derecha -->
    <g class="leaf leaf-lower-right" [class.grown]="isBloomed" style="transform-origin: 254px 370px;">
      <path
        d="M 254 370 C 335 355, 400 330, 420 375 C 385 425, 310 410, 254 375 Z"
        fill="url(#leafGradSecondary)"
        stroke="#14532d"
        stroke-width="1.5"
      />
      <path
        d="M 254 370 Q 340 375, 420 375 M 290 371 Q 315 358, 335 350 M 340 373 Q 365 363, 385 356 M 300 376 Q 325 395, 350 400"
        fill="none"
        stroke="#bbf7d0"
        stroke-width="1.2"
        opacity="0.6"
      />
      <circle cx="360" cy="372" r="3" fill="url(#dewDropGrad)" />
      <circle cx="359" cy="371" r="0.9" fill="#ffffff" />
    </g>

    <!-- 3. Hoja Superior Izquierda -->
    <g class="leaf leaf-upper-left" [class.grown]="isBloomed" style="transform-origin: 248px 300px;">
      <path
        d="M 248 300 C 185 285, 140 255, 125 290 C 150 335, 210 325, 248 303 Z"
        fill="url(#leafGradPrimary)"
        stroke="#166534"
        stroke-width="1.5"
      />
      <path
        d="M 248 300 Q 185 300, 125 290 M 215 300 Q 195 288, 180 280 M 175 301 Q 155 292, 145 286"
        fill="none"
        stroke="#86efac"
        stroke-width="1"
        opacity="0.5"
      />
    </g>

    <!-- 4. Hoja Superior Derecha (Joven y luminosa) -->
    <g class="leaf leaf-upper-right" [class.grown]="isBloomed" style="transform-origin: 252px 240px;">
      <path
        d="M 252 240 C 310 225, 360 200, 375 230 C 350 268, 298 260, 252 243 Z"
        fill="url(#leafGradSecondary)"
        stroke="#166534"
        stroke-width="1.4"
      />
      <path
        d="M 252 240 Q 315 240, 375 230 M 285 240 Q 305 230, 320 224"
        fill="none"
        stroke="#bbf7d0"
        stroke-width="1"
        opacity="0.5"
      />
    </g>

    <!-- SÉPALOS / CÁLIZ VERDE DE LA FLOR (SE ABREN CON EL FLORECIMIENTO) -->
    <g class="calyx-group" [class.bloomed]="isBloomed" style="transform-origin: 250px 170px;">
      <path d="M 250 170 C 230 195, 220 215, 235 225 C 245 220, 255 195, 250 170 Z" fill="#15803d" />
      <path d="M 250 170 C 265 195, 280 215, 265 225 C 255 220, 245 195, 250 170 Z" fill="#166534" />
      <path d="M 250 170 C 215 180, 195 195, 205 208 C 220 205, 238 188, 250 170 Z" fill="#14532d" />
      <path d="M 250 170 C 285 180, 305 195, 295 208 C 280 205, 262 188, 250 170 Z" fill="#14532d" />
    </g>

    <!-- CABEZA DE LA FLOR (PÉTALOS MULTICAPA Y CORAZÓN FIBONACCI) -->
    <g class="flower-head" style="transform-origin: 250px 170px;">
      <!-- AURA RADIANTE CUANDO ESTÁ ABIERTA -->
      @if (isBloomed) {
        <circle
          cx="250"
          cy="170"
          r="140"
          fill="url(#godRayGrad)"
          class="center-aura pointer-events-none"
        />
      }

      <!-- CAPA 1: PÉTALOS EXTERIORES MAYORES (18 Pétalos) -->
      <g class="petal-layer-1" style="transform-origin: 250px 170px;">
        @for (petal of layer1Petals; track petal.angle) {
          <g
            class="petal petal-l1"
            [class.bloomed]="isBloomed"
            [style.--angle]="petal.angle + 'deg'"
            [style.transition-delay]="petal.delay + 's'"
            filter="url(#petalShadow3D)"
          >
            <!-- Pétalo esculpido suavemente redondeado y afilado en la punta -->
            <path
              d="M 250 170
                 C 230 135, 222 80, 250 40
                 C 278 80, 270 135, 250 170 Z"
              fill="url(#petalGrad1)"
              stroke="#ca8a04"
              stroke-width="0.75"
            />
            <!-- Nervadura central del pétalo -->
            <path
              d="M 250 165 Q 250 100, 250 55"
              fill="none"
              stroke="#b45309"
              stroke-width="0.9"
              opacity="0.5"
            />
            <!-- Reflejo suave en el borde izquierdo -->
            <path
              d="M 248 160 Q 232 100, 248 50"
              fill="none"
              stroke="#ffffff"
              stroke-width="0.8"
              opacity="0.4"
            />
          </g>
        }
      </g>

      <!-- CAPA 2: PÉTALOS MEDIOS AMARILLO SOL (18 Pétalos) -->
      <g class="petal-layer-2" style="transform-origin: 250px 170px;">
        @for (petal of layer2Petals; track petal.angle) {
          <g
            class="petal petal-l2"
            [class.bloomed]="isBloomed"
            [style.--angle]="petal.angle + 'deg'"
            [style.transition-delay]="petal.delay + 's'"
            filter="url(#petalShadow3D)"
          >
            <path
              d="M 250 170
                 C 232 140, 225 90, 250 52
                 C 275 90, 268 140, 250 170 Z"
              fill="url(#petalGrad2)"
              stroke="#d97706"
              stroke-width="0.7"
            />
            <path
              d="M 250 165 Q 250 105, 250 65"
              fill="none"
              stroke="#ca8a04"
              stroke-width="0.8"
              opacity="0.5"
            />
            <path
              d="M 248 160 Q 235 105, 248 60"
              fill="none"
              stroke="#ffffff"
              stroke-width="0.8"
              opacity="0.5"
            />
          </g>
        }
      </g>

      <!-- CAPA 3: PÉTALOS INTERIORES BRILLANTES (16 Pétalos) -->
      <g class="petal-layer-3" style="transform-origin: 250px 170px;">
        @for (petal of layer3Petals; track petal.angle) {
          <g
            class="petal petal-l3"
            [class.bloomed]="isBloomed"
            [style.--angle]="petal.angle + 'deg'"
            [style.transition-delay]="petal.delay + 's'"
            filter="url(#petalShadow3D)"
          >
            <path
              d="M 250 170
                 C 234 142, 228 100, 250 68
                 C 272 100, 266 142, 250 170 Z"
              fill="url(#petalGrad3)"
              stroke="#b45309"
              stroke-width="0.65"
            />
            <path
              d="M 250 165 Q 250 115, 250 78"
              fill="none"
              stroke="#9a3412"
              stroke-width="0.75"
              opacity="0.6"
            />
          </g>
        }
      </g>

      <!-- CAPA 4: PÉTALOS FLORALES DEL CORAZÓN (14 Pétalos) -->
      <g class="petal-layer-4" style="transform-origin: 250px 170px;">
        @for (petal of layer4Petals; track petal.angle) {
          <g
            class="petal petal-l4"
            [class.bloomed]="isBloomed"
            [style.--angle]="petal.angle + 'deg'"
            [style.transition-delay]="petal.delay + 's'"
            filter="url(#petalShadow3D)"
          >
            <path
              d="M 250 170
                 C 236 148, 232 115, 250 85
                 C 268 115, 264 148, 250 170 Z"
              fill="url(#petalGrad4)"
              stroke="#9a3412"
              stroke-width="0.6"
            />
          </g>
        }
      </g>

      <!-- CENTRO DE GIRASOL CON ESPIRAL DE FIBONACCI (FILOTAXIS DE 68 FLORETES) -->
      <g class="flower-center" [class.bloomed]="isBloomed" style="transform-origin: 250px 170px;">
        <!-- Anillo de luz aureolar -->
        <circle
          cx="250"
          cy="170"
          r="45"
          fill="none"
          stroke="#fde047"
          stroke-width="3.5"
          stroke-opacity="0.8"
          class="animate-pulse"
        />

        <!-- Disco base de chocolate aterciopelado -->
        <circle
          cx="250"
          cy="170"
          r="42"
          fill="url(#sunflowerCoreGrad)"
          stroke="#78350f"
          stroke-width="2.5"
        />

        <!-- Floretes individuales dispuestos en espiral dorada de Fibonacci -->
        @for (seed of spiralSeeds; track seed.x + '-' + seed.y) {
          <circle
            [attr.cx]="seed.x"
            [attr.cy]="seed.y"
            [attr.r]="seed.size"
            [attr.fill]="seed.color"
            [attr.stroke]="seed.glow ? '#fef08a' : '#290e02'"
            [attr.stroke-width]="seed.glow ? '0.8' : '0.4'"
            [class.seed-sparkle]="seed.glow"
          />
        }

        <!-- Centro estigma súper radiante -->
        <circle cx="250" cy="170" r="5" fill="#fef08a" class="animate-ping opacity-60" />
        <circle cx="250" cy="170" r="4.5" fill="#ffffff" />
      </g>
    </g>

    <!-- PARTÍCULAS MÁGICAS EN ÓRBITA ALREDEDOR DE LA FLOR -->
    @if (isBloomed) {
      <g class="aura-sparks-group" style="transform-origin: 250px 170px;">
        @for (spark of auraSparks; track spark.delay) {
          <circle
            cx="250"
            cy="170"
            r="2"
            fill="#fde047"
            class="orbiting-spark"
            [style.animation-delay]="spark.delay + 's'"
            [style.animation-duration]="spark.duration + 's'"
            [style.--orbit-r]="spark.radius + 'px'"
          />
        }
      </g>
    }
  </svg>
</div>
